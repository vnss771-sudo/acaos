server {
    # Non-privileged port: the container runs as non-root (UID 101) and cannot
    # bind to ports <1024. Host port mapping stays 8080 (see docker-compose).
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the static SPA. The API sets its own headers; these
    # protect the frontend shell against clickjacking, MIME sniffing, and XSS.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Strict CSP. React style objects are transformed by the ACAOS JSX runtime
    # into generated CSS classes backed by a constructable/same-origin stylesheet,
    # so production does not require inline style attributes or <style> blocks.
    # connect-src remains HTTPS-broad until deployment injects an exact API origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'none'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
