server {
    # Non-privileged port: the container runs as non-root (UID 101) and cannot
    # bind to ports <1024. Host port mapping stays 8080 (see docker-compose).
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the static SPA. The API sets its own headers; these
    # protect the frontend shell against clickjacking, MIME sniffing, and XSS.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Strict CSP: no 'unsafe-inline' anywhere.
    #   style-src-elem 'self'  — only same-origin <link> stylesheets; no inline <style>.
    #   style-src-attr 'none'  — no style="" attributes from markup or setAttribute().
    # React's style={{}} props remain allowed: the client renderer applies them
    # through the CSSOM (element.style), which CSP does not govern. Anything that
    # writes raw style attributes or <style> elements would be blocked; that is
    # gated statically by `npm run check:csp` and in a real browser by
    # e2e/csp-strict.spec.ts against this exact header.
    # connect-src allows the API over HTTPS — tighten to your exact API origin
    # (e.g. https://api.acaos.app) for a stricter policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'none'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
