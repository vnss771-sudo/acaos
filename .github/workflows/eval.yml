name: AI quality eval

# Runs the outreach/research quality evals (scripts/eval-outreach.ts,
# scripts/eval-research.ts) against the real OpenAI API. Deliberately NOT run
# on every PR — each run makes several real, billed model calls, so it's kept
# to a weekly schedule (plus manual dispatch) to control spend rather than
# multiplying that cost across every push.
on:
  schedule:
    # Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write # the eval job commits its own score-history JSON back to the repo (see below)

env:
  NODE_VERSION: '22'

jobs:
  eval:
    name: Outreach + research quality eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Prisma engines
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/prisma-nodejs
            ~/.cache/prisma
          key: prisma-engines-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            prisma-engines-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      # Both scripts exit 0 (skip) if OPENAI_API_KEY is unset, so this step is
      # safe even if the secret is missing — but that would silently defeat the
      # point of this workflow, so fail loudly instead of reporting a false green.
      - name: Confirm OPENAI_API_KEY is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY repo secret is not set — the eval would silently skip (exit 0) and this run would falsely report success. Add the secret to run real evals."
            exit 1
          fi

      # A real regression (a FAIL finding) must fail the job — both scripts
      # already exit 1 on any FAIL, so a non-zero exit here IS the loud signal;
      # nothing here catches or downgrades that exit code. Each script also
      # writes its score to eval-results/*.json (and prints the lift vs. the
      # last recorded run) before exiting, pass or fail — `if: always()` below
      # carries that write through to the commit step even after a FAIL, so a
      # real regression shows up in the trend instead of being silently omitted.
      - name: Outreach quality eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run eval:outreach

      - name: Research quality eval
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run eval:research

      # Persist the score history the two steps above just wrote, so "lift" is
      # a real number tracked over time (eval-results/*.json) rather than only
      # ever visible in this run's ephemeral job log. Runs even if an eval step
      # failed, and no-ops cleanly if there's nothing new to record (e.g. the
      # OPENAI_API_KEY check above failed before either script could run).
      - name: Commit eval score history
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- eval-results)" ]; then
            echo "No eval score changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval-results
          git commit -m "chore(eval): record eval run results [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
