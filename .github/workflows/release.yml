name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch, tag, or SHA) to package
        required: true
        default: main
        type: string
      publish:
        description: Publish or refresh the GitHub Release asset for an existing tag
        required: true
        default: false
        type: boolean
      release_tag:
        description: Existing semver tag to publish when publish=true (for example v1.2.3)
        required: false
        type: string

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag || inputs.ref }}
  cancel-in-progress: false

# Least privilege at the top; the one job that needs to publish a Release grants
# itself contents: write explicitly.
permissions: {}

env:
  NODE_VERSION: '22'

jobs:
  package:
    name: Package release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'staging' }}
    outputs:
      publish: ${{ steps.release_target.outputs.publish }}
      tag: ${{ steps.release_target.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Package the exact source being released. On a tag push that's the tag;
          # on a publish dispatch, package the release_tag itself (NOT an arbitrary
          # ref) so the published asset always matches the tag it's attached to;
          # otherwise (artifact-only dispatch) package the requested ref.
          ref: ${{ github.event_name == 'push' && github.ref || (inputs.publish && inputs.release_tag) || inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve release target
        id: release_target
        shell: bash
        # Inputs are passed via env (never interpolated into the script body) to
        # avoid shell injection from workflow_dispatch input values.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            publish="true"
          else
            tag="$INPUT_RELEASE_TAG"
            publish="$INPUT_PUBLISH"
          fi

          if [[ "$publish" == "true" && -z "$tag" ]]; then
            echo "::error::release_tag is required when publish=true for workflow_dispatch."
            exit 1
          fi

          if [[ -n "$tag" && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must look like v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Compute release metadata
        run: |
          npm run release:metadata:env > .release-metadata.env
          cat .release-metadata.env >> "$GITHUB_ENV"
          npm run release:metadata -- --manifest dist-pack/release-manifest.json

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Verify release candidate
        run: npm run verify

      - name: Build release archive
        run: npm run pack

      # Software Bill of Materials for the released source tree, so consumers and
      # auditors can see exactly which dependencies ship in a given release. Pinned
      # to a full commit SHA per the check:workflow-pinning gate; the checksum step
      # below picks the SBOM up automatically.
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@df80a981bc0e7c93f351eab5f43b39e5ea173d5f # v0.17.9
        with:
          path: .
          format: spdx-json
          output-file: dist-pack/acaos-sbom.spdx.json
          artifact-name: acaos-sbom.spdx.json

      # Tamper-evident checksums for every release artifact. Consumers verify with
      # `sha256sum -c SHA256SUMS.txt`. Computed over the files that exist; the SBOM
      # is included automatically once the step above is enabled.
      - name: Generate artifact checksums
        working-directory: dist-pack
        run: |
          shopt -s nullglob
          files=(acaos-source.zip release-manifest.json acaos-sbom.spdx.json)
          present=()
          for f in "${files[@]}"; do [[ -f "$f" ]] && present+=("$f"); done
          sha256sum "${present[@]}" | tee SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acaos-source-${{ steps.release_target.outputs.tag || github.sha }}
          path: |
            dist-pack/acaos-source.zip
            dist-pack/release-manifest.json
            dist-pack/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release asset
        if: ${{ steps.release_target.outputs.publish == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.release_target.outputs.tag }}
        with:
          script: |
            const fs = require('node:fs');
            const tag = process.env.RELEASE_TAG;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Attach the source archive, the SBOM (if generated), and the
            // checksum manifest so the Release carries both the artifacts and the
            // means to verify them (sha256sum -c SHA256SUMS.txt).
            const candidates = [
              { path: 'dist-pack/acaos-source.zip', name: 'acaos-source.zip', type: 'application/zip' },
              { path: 'dist-pack/acaos-sbom.spdx.json', name: 'acaos-sbom.spdx.json', type: 'application/json' },
              { path: 'dist-pack/SHA256SUMS.txt', name: 'SHA256SUMS.txt', type: 'text/plain' },
            ];
            const assets = candidates.filter((a) => fs.existsSync(a.path));

            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = existing.data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: true,
              });
              release = created.data;
            }

            for (const asset of assets) {
              const duplicate = release.assets.find((existing) => existing.name === asset.name);
              if (duplicate) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: duplicate.id });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: asset.name,
                headers: {
                  'content-type': asset.type,
                  'content-length': String(fs.statSync(asset.path).size),
                },
                data: fs.readFileSync(asset.path),
              });
              core.info(`Uploaded release asset: ${asset.name}`);
            }

  # Canary/blue-green bake + automatic-rollback-on-burn-rate gate. Inert
  # (skips its own steps cleanly) until an operator sets CANARY_URL on the
  # target GitHub Environment (staging/production) — this repo has no single
  # deploy platform committed to it (see docs/DEPLOYMENT.md), so this job
  # provides the platform-agnostic bake/gate mechanism and two optional
  # webhook hand-offs (PROMOTE_WEBHOOK_URL, ROLLBACK_WEBHOOK_URL) for whatever
  # platform-specific traffic-shift/redeploy the operator's canary or
  # blue-green slot actually needs. See scripts/rollout-gate.mjs and
  # docs/DEPLOYMENT.md for the full mechanism and how to configure it.
  canary_bake:
    name: Canary bake + auto-rollback gate
    needs: package
    if: needs.package.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check whether a canary target is configured
        id: check
        shell: bash
        env:
          CANARY_URL: ${{ vars.CANARY_URL }}
        run: |
          if [[ -z "$CANARY_URL" ]]; then
            echo "::notice::CANARY_URL is not set for this environment — skipping the canary bake. Configure it (and optionally PROMOTE_WEBHOOK_URL / ROLLBACK_WEBHOOK_URL) to enable canary/blue-green gating; see docs/DEPLOYMENT.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Bake the canary and gate on readiness + 5xx burn rate. A deploy
      # pipeline is expected to have already deployed the new image to
      # CANARY_URL as a separate slot/instance before this workflow reaches
      # this step (a second Railway/Fly service, a k8s canary Deployment
      # behind the same Service, an ALB target group, ...).
      - name: Bake canary and gate on health/burn-rate
        if: steps.check.outputs.configured == 'true'
        env:
          CANARY_URL: ${{ vars.CANARY_URL }}
          BAKE_SECONDS: ${{ vars.CANARY_BAKE_SECONDS }}
        run: node scripts/rollout-gate.mjs

      # Promote: hand off to the platform's own traffic-shift mechanism. Only
      # called when the gate above actually ran and passed.
      - name: Promote canary to primary
        if: steps.check.outputs.configured == 'true' && success() && vars.PROMOTE_WEBHOOK_URL != ''
        env:
          PROMOTE_WEBHOOK_URL: ${{ vars.PROMOTE_WEBHOOK_URL }}
        run: curl -fsS -X POST "$PROMOTE_WEBHOOK_URL"

      # Automatic rollback: fires only when the bake step above genuinely
      # failed (unhealthy canary) — `failure()` does not trigger on a step
      # skipped because no canary was configured. Hands off to the platform's
      # own "redeploy the previous known-good tag" mechanism (the manual
      # rollback step in docs/DEPLOYMENT.md, automated).
      - name: Automatic rollback on a failed bake
        if: steps.check.outputs.configured == 'true' && failure() && secrets.ROLLBACK_WEBHOOK_URL != ''
        env:
          ROLLBACK_WEBHOOK_URL: ${{ secrets.ROLLBACK_WEBHOOK_URL }}
        run: curl -fsS -X POST "$ROLLBACK_WEBHOOK_URL"

  # Auto-trigger the post-deploy smoke check on every published release,
  # closing the "post-deploy smoke isn't auto-triggered by release" gap.
  # Inert the same way canary_bake is: post-deploy-smoke.yml itself no-ops
  # with a clear error if SMOKE_API_URL/SMOKE_WORKER_URL aren't configured on
  # the target environment.
  post_deploy_smoke:
    name: Post-deploy smoke (auto-triggered)
    needs: package
    if: needs.package.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/post-deploy-smoke.yml
    with:
      environment: ${{ github.event_name == 'push' && 'production' || 'staging' }}
    secrets: inherit
