version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    # Minor and patch updates are grouped so they land in one routine PR. Major
    # updates are left out of the groups on purpose: each one arrives as its own
    # PR, so a single breaking upgrade (Prisma, Express, React, TypeScript...)
    # can't block every other bump in its group.
    groups:
      node-prod:
        dependency-type: production
        update-types:
          - minor
          - patch
      node-dev:
        dependency-type: development
        update-types:
          - minor
          - patch
      node-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    groups:
      base-images:
        patterns:
          - "*"
    commit-message:
      prefix: docker
      include: scope
